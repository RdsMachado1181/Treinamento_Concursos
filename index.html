<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 

  <title>Topo Responsivo</title>
 
</head>
<body>
<style>
   
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
}

.topo {
  display: flex;
  height: 100px;
  width: 100%;
}

.esquerda, .direita {
  display: flex;
  align-items: center;
  justify-content: center;
}

.esquerda {
  width: 70%;
  background-color: #4CAF50;
  gap: 30px; /* Espaçamento entre links */
}

.esquerda a {
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  transition: 0.3s;
}

.esquerda a:hover {
  text-decoration: underline;
}

.direita {
  width: 30%;
  background-color: #2196F3;
  color: white;
  font-size: 20px;
}

@media (max-width: 768px) {
  .topo {
    flex-direction: column;
    height: auto;
  }

  .esquerda, .direita {
    width: 100%;
    height: 100px;
  }

  .esquerda {
    justify-content: space-around;
  }
}

.corpo {
  width: 100%;
  height: 800px;
  background-color: rgb(192, 109, 8);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 20px;
  text-align: right;
  color: white;
  padding-right: 120px;
}

.titulo {
  font-size: 32px;
  font-weight: bold;
  
}

.titulo-texto a {
  font-size: 20px;
  color: white;
  text-decoration: none;
  background-color: rgba(0, 0, 0, 0.2);
  padding: 10px 20px;
  border-radius: 8px;
  transition: 0.3s;
 
}

.titulo-texto a:hover {
  background-color: rgba(0, 0, 0, 0.4);
}
.texto-centro{
background-color: #87db18;
width: 100%;
height: 800px;
display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 20px;
  text-align: right;
  color: white;
  padding-right: 120px;
}
.faixa-centro{
width: 100%;
height: 100px;
background-color: #2196F3;

}
.rodape{
width: 100%;
height: 300px;
background-color: #f38015;
}
 
</style>
  <header class="topo">
    <div class="esquerda">
      <a href="#">SOBRE</a>
      <a href="#">CONTATOS</a>
      <a href="#">INSTRUÇÕES</a>
    </div>
    <div class="direita">
      Parte Direita (30%)
    </div>
  </header>

  <main>
    <div class="corpo">
      <div class="titulo">PERGUNTAS</div>
      <div class="titulo-texto">
        <a href="adicionar.html">Clique aqui e adicione suas perguntas</a>
      </div> 

    </div>

    <div class="faixa-centro"> FAIXA-CENTRAL
       
    </div> 
          <div class=" texto-centro"> TEXTO-CENTRAL</div>
           
  </main>

  <footer  >
    <div class="rodape">
   <!-- Rodapé opcional -->
    </div>
 
  </footer>

</body>
</html>
