<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

   
<link rel="stylesheet" href="adicionar.css"/>
<link rel="stylesheet" href="adicionar.js"/>

  <title>Adicionar Pergunta</title>
  
</head>
<body>

  <style>

     
    /* Estilos mantidos */
    * { 
        margin: 0;
         padding: 0;
          box-sizing: border-box;
         }
    body { 
        font-family: Arial,
         sans-serif; 
         background-color: #f0f0f0; }
    .topo { display: flex; height: 100px; background-color: #f44336; align-items: center; justify-content: flex-end; font-size: 24px; color: white; }
    .topo a { padding-right: 80px; font-size: 15px; }
    .layout { display: flex; min-height: calc(100vh - 100px); }
    .coluna { padding: 20px; }
    .esquerda { width: 25%; background-color: #e0e0e0; overflow-y: auto; height: calc(100vh - 100px); }
    .centro { width: 50%; background-color: #ffffff; display: flex; align-items: center; justify-content: center; height: calc(100vh - 100px); }
    .direita { width: 25%; background-color: #e0e0e0; }
    .container { width: 100%; max-width: 500px; padding: 20px; background-color: #fafafa; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
    textarea, input[type="text"] { width: 100%; padding: 10px; font-size: 16px; margin-top: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; }
    .botoes { display: flex; justify-content: space-between; margin-top: 10px; }
    button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
    .limpar { background-color: #f44336; color: white; }
    .salvar { background-color: #4CAF50; color: white; }
    .salvar-tudo { margin-top: 20px; width: 100%; background-color: #2196F3; color: white; }
    ul { list-style: none; padding-left: 0; }
    li { background-color: #fff; padding: 10px; margin-bottom: 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    li:hover { background-color: #ccc; }
    .resposta { display: flex; align-items: center; gap: 10px; }
    .delete-btn { background-color: #f44336; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 14px; }
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .esquerda, .centro, .direita { width: 100%; height: auto; }
      .centro { height: auto; justify-content: center; padding: 20px; }
      .container { margin-top: 20px; }
    }
 

  </style>
  <header class="topo">
    <a href="index.html">PAGINA PRINCIPAL</a>
  </header>

  <div class="layout">
    <div class="coluna esquerda">
      <h3>Perguntas Adicionadas:</h3>
      <ul id="listaPerguntas"></ul>
    </div>

    <div class="coluna centro">
      <div class="container">
        <h2>Adicionar Nova Pergunta</h2>
        <textarea id="pergunta" placeholder="Digite a pergunta..."></textarea>
        <div id="respostas">
          <div class="resposta"><input type="radio" name="correta" value="0"> <input type="text" placeholder="Resposta 1" class="input-resposta" /></div>
          <div class="resposta"><input type="radio" name="correta" value="1"> <input type="text" placeholder="Resposta 2" class="input-resposta" /></div>
          <div class="resposta"><input type="radio" name="correta" value="2"> <input type="text" placeholder="Resposta 3" class="input-resposta" /></div>
          <div class="resposta"><input type="radio" name="correta" value="3"> <input type="text" placeholder="Resposta 4" class="input-resposta" /></div>
          <div class="resposta"><input type="radio" name="correta" value="4"> <input type="text" placeholder="Resposta 5" class="input-resposta" /></div>
        </div>

        <div class="botoes">
          <button class="limpar" onclick="limpar()">Limpar</button>
          <button class="salvar" onclick="salvar()">Salvar</button>
        </div>

        <button class="salvar-tudo" onclick="salvarTudo()">Salvar Tudo</button>
      </div>
    </div>

    <div class="coluna direita">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px;">
        <label for="tempoTotal">Tempo Total (min):</label>
        <input type="number" id="tempoTotal" min="1" value="60" style="width: 80px; padding: 5px; text-align: center;">

        <label for="quantidadePerguntas">Nº de Perguntas:</label>
        <input type="number" id="quantidadePerguntas" min="1" value="20" style="width: 80px; padding: 5px; text-align: center;">

        <div id="tempoPorPergunta" style="margin-top: 10px; font-weight: bold;">
          Tempo por pergunta: -- min
        </div>

        <div id="maxPerguntas" style="margin-top: 10px;">
          Total permitido: <span id="totalPermitido">50</span> perguntas
        </div>
      </div>
    </div>
  </div>
<script>

   
const perguntas = [];
let perguntaEditando = null;

const maxPerguntasPermitidas = 50;
const totalPermitido = document.getElementById('totalPermitido');
const quantidadePerguntasInput = document.getElementById('quantidadePerguntas');
totalPermitido.textContent = maxPerguntasPermitidas;

function limpar() {
  document.getElementById('pergunta').value = '';
  document.querySelectorAll('.input-resposta').forEach(el => el.value = '');
  document.querySelectorAll('input[name="correta"]').forEach(el => el.checked = false);
  perguntaEditando = null;
}

function salvar() {
  const texto = document.getElementById('pergunta').value.trim();
  const respostas = Array.from(document.querySelectorAll('.input-resposta')).map(r => r.value.trim());
  const correta = document.querySelector('input[name="correta"]:checked');

  if (!texto || respostas.some(r => !r) || !correta) {
    alert("Preencha todos os campos e selecione a resposta correta.");
    return;
  }

  const numPerguntas = parseInt(quantidadePerguntasInput.value);

  if (perguntas.length >= numPerguntas) {
    alert(`Você atingiu o limite de ${numPerguntas} perguntas.`);
    return;
  }

  const perguntaObj = {
    texto,
    respostas,
    correta: parseInt(correta.value)
  };

  if (perguntaEditando !== null) {
    perguntas[perguntaEditando] = perguntaObj;
  } else {
    perguntas.push(perguntaObj);
  }

  limpar();
  atualizarLista();
}

function atualizarLista() {
  const lista = document.getElementById('listaPerguntas');
  lista.innerHTML = '';

  perguntas.forEach((p, i) => {
    const li = document.createElement('li');
    li.textContent = `${i + 1}. ${p.texto}`;

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Excluir';
    deleteBtn.className = 'delete-btn';
    deleteBtn.onclick = () => excluirPergunta(i);

    li.appendChild(deleteBtn);
    li.onclick = () => editarPergunta(i);
    lista.appendChild(li);
  });
}

function editarPergunta(index) {
  const p = perguntas[index];
  document.getElementById('pergunta').value = p.texto;
  document.querySelectorAll('.input-resposta').forEach((el, i) => {
    el.value = p.respostas[i];
  });
  document.querySelectorAll('input[name="correta"]').forEach(el => {
    el.checked = parseInt(el.value) === p.correta;
  });
  perguntaEditando = index;
}

function excluirPergunta(index) {
  if (confirm("Tem certeza que deseja excluir esta pergunta?")) {
    perguntas.splice(index, 1);
    atualizarLista();
  }
}

function salvarTudo() {
  console.log("Perguntas salvas:", perguntas);
  alert("Todas as perguntas foram salvas (ver console para dados).");

  const tempoTotal = document.getElementById('tempoTotal').value;
  localStorage.setItem('tempoTotal', tempoTotal);

  localStorage.setItem('perguntas', JSON.stringify(perguntas));

  window.location.href = "prova.html";
}

const tempoInput = document.getElementById('tempoTotal');
const tempoPorPergunta = document.getElementById('tempoPorPergunta');

function calcularTempoPorPergunta() {
  const totalMin = parseFloat(tempoInput.value);
  const totalPerguntas = parseInt(quantidadePerguntasInput.value);

  if (totalPerguntas > maxPerguntasPermitidas) {
    quantidadePerguntasInput.value = maxPerguntasPermitidas;
    alert(`Máximo de ${maxPerguntasPermitidas} perguntas permitido.`);
  }

  if (!isNaN(totalMin) && !isNaN(totalPerguntas) && totalPerguntas > 0) {
    const tempo = (totalMin / totalPerguntas).toFixed(2);
    tempoPorPergunta.textContent = `Tempo por pergunta: ${tempo} min`;
  } else {
    tempoPorPergunta.textContent = 'Tempo por pergunta: -- min';
  }
}

tempoInput.addEventListener('input', calcularTempoPorPergunta);
quantidadePerguntasInput.addEventListener('input', calcularTempoPorPergunta);

calcularTempoPorPergunta();
 

 
</script>
 
</body>
</html>
