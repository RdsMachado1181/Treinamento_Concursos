<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 

  <title>Início - Prova</title>
  
</head>
<body>

    <style>

         
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px;
      margin: 0;
    }
    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
    }
    h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
    }
    .botao {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      width: 100%;
      margin-top: 20px;
    }
 


    </style>
  <div class="container">
    <h2>Bem-vindo à Prova</h2>
    <button class="botao" onclick="iniciarProva()">Iniciar Prova</button>
  </div>

 <script>

     
// Função para redirecionar para a página de início da prova
function iniciarProva() {
  window.location.href = 'comecarProva.html';  // Redireciona para a página da prova
}
 


 </script>
</body>
</html>
