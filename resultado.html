<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


 

  <title>Resultado da Prova</title>
 
</head>
<body>

    <style>

         
body {
  font-family: Arial, sans-serif;
  background-color: #f0f0f0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.container {
  background-color: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  width: 100%;
  max-width: 600px;
}
h2 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 20px;
}
.resultado {
  font-size: 20px;
  margin-bottom: 10px;
}
.botao {
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  border: none;
  border-radius: 5px;
  background-color: #4CAF50;
  color: white;
  margin-top: 20px;
}
 


    </style>
  <div class="container">
    <h2>Resultado da Prova</h2>
    <div class="resultado" id="resultado"></div>
    <button class="botao" onclick="voltarParaPaginaInicial()">Voltar à Página Inicial</button>
  </div>

 <script>

     
function mostrarResultado() {
  const resultado = localStorage.getItem('resultado');
  const resultadoDiv = document.getElementById('resultado');
  
  if (resultado) {
    resultadoDiv.textContent = `Você acertou ${resultado} de 2 questões.`;
  } else {
    resultadoDiv.textContent = 'Nenhum resultado encontrado.';
  }
}

function voltarParaPaginaInicial() {
  window.location.href = 'index.html'; // Redireciona para a página inicial
}

mostrarResultado();
 


 </script>
</body>
</html>
